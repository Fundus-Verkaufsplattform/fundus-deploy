name: Build app image

on:
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: "Branch, tag or commit of Fundus-Verkaufsplattform/fundus"
        required: false
        default: "main"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "compose.yml"
      - ".github/workflows/app.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fundus-verkaufsplattform/fundus-moodle
  BASE_IMAGE: ghcr.io/fundus-verkaufsplattform/fundus-moodle-base:5.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Checkout Fundus plugin
        run: |
          git clone https://github.com/Fundus-Verkaufsplattform/fundus.git plugin
          cd plugin
          git checkout "${{ github.event.inputs.plugin_ref || 'main' }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
